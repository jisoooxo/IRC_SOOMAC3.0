<text x="590" y="600" class="ct">Decision 1번에 다시 계산하는 양 (캐시 적중 시)</text>
<rect x="590" y="614" width="446" height="28" rx="4" fill="#2c4a6e" stroke="#3987e5" stroke-width="0"/>
<text x="813.0" y="633" class="barw" text-anchor="middle">저장한 메모 재사용 (계산 안 함)</text>
<rect x="1038" y="614" width="32" height="28" rx="4" fill="#eb6834" stroke="#e9973f" stroke-width="0"/>
<text x="1078" y="633" class="note">대화</text>
<text x="590" y="664" class="cb">읽기는 대부분 생략 · 쓰기(decode) 오버헤드는 남음 (추정)</text>
<text x="1140" y="600" class="ct">Decision 1번에 다시 계산하는 양 (캐시 적중 시)</text>
<rect x="1140" y="614" width="446" height="28" rx="4" fill="#2c4a6e" stroke="#3987e5" stroke-width="0"/>
<text x="1363.0" y="633" class="barw" text-anchor="middle">엔진이 저장한 메모 재사용 (적중률 약 80%)</text>
<rect x="1588" y="614" width="32" height="28" rx="4" fill="#eb6834" stroke="#e9973f" stroke-width="0"/>
<text x="1628" y="633" class="note">대화</text>
<text x="1140" y="664" class="cb">쓰기 쪽도 빨라짐 · CUDA graph·LoRA 커널 덕으로 추정 (미분리)</text>
<rect x="40" y="684" width="520" height="212" rx="12" fill="#262626" stroke="#8a8a8a" stroke-width="1.5"/>
