      <text x="18" y="80" fill="#0f172a" font-size="22" font-weight="700">Voice order</text>
      <text x="18" y="107" fill="#475569" font-size="14">Qwen3-ASR + Silero VAD</text>
      <text x="18" y="131" fill="#64748b" font-size="12">Ingredients / amounts / preferences</text>
    </g>
    <g transform="translate(332 108)">
      <rect width="244" height="152" rx="12" fill="#ffffff" stroke="#dbe4ed"/>
      <rect x="18" y="18" width="34" height="30" rx="8" fill="#eef2ff"/>
      <text x="35" y="39" text-anchor="middle" fill="#4f46e5" font-size="14" font-weight="700">02</text>
      <text x="18" y="80" fill="#0f172a" font-size="22" font-weight="700">Language agents</text>
      <text x="18" y="107" fill="#475569" font-size="14">Decision / Recommend / Respond</text>
      <text x="18" y="131" fill="#64748b" font-size="12">Gemma 4 + LoRA / LangGraph</text>
    </g>
    <g transform="translate(624 108)">
