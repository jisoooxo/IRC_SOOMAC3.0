<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">SOOMAC 3.0 system overview</title>
  <desc id="desc">Voice order flows through language agents, robot packing, and visual verification.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#94a3b8" stroke-width="1.5"/></marker></defs>
  <rect x="1" y="1" width="1198" height="328" rx="18" fill="#f8fafc" stroke="#dbe4ed"/>
  <g font-family="Arial, sans-serif">
